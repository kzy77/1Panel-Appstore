services:
  dashboard:
    image: ghcr.io/nezhahq/nezha:v2.3.6
    container_name: ${CONTAINER_NAME}
    restart: always
    volumes:
      - ./data:/dashboard/data
    ports:
      - ${PANEL_APP_PORT_HTTP}:8008
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true
