services:
  frontend:
    image: wechatopenai/weknora-ui:latest
    container_name: ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
      - APP_HOST=${APP_HOST:-app}
      - APP_PORT=${APP_BACKEND_PORT:-8080}
      - APP_SCHEME=${APP_SCHEME:-http}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - 1panel-network
    restart: always
    labels:
      createdBy: "Apps"

  app:
    image: wechatopenai/weknora-app:latest
    container_name: ${CONTAINER_NAME}-app
    ports:
      - "${PANEL_APP_PORT_API}:8080"
    volumes:
      - ./data/files:/data/files
      - ./data/docreader-tmp:/tmp/docreader:ro
    environment:
      # ========== 日志 ==========
      # 日志级别，默认debug
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # 日志文件路径（留空则只输出 stdout）；LLM_DEBUG_LOG 开启时同目录写 llm_debug.log
      - LOG_PATH=${LOG_PATH:-}
      # 自定义日志格式模板（留空用内置默认格式）
      - LOG_FORMAT=${LOG_FORMAT:-}
      # LLM 调试日志：true 写 LOG_PATH 同目录 llm_debug.log，或指定路径；留空关闭
      - LLM_DEBUG_LOG=${LLM_DEBUG_LOG:-false}
      # ========== 运行时基础 ==========
      # gin mod
      # 可选值: debug(开发模式，有详细日志), release(生产模式，禁用Swagger文档)
      - GIN_MODE=${GIN_MODE:-release}
      # 时区，默认为Asia/Shanghai
      - TZ=${TZ:-Asia/Shanghai}
      # 文档处理语言（问题/摘要生成）。优先级：此环境变量（部署级覆盖，非空即生效）
      # > Accept-Language 请求头 > 内置默认值 (zh-CN)。留空则跟随请求方 Accept-Language。
      - WEKNORA_LANGUAGE=${WEKNORA_LANGUAGE:-}
      # Docker 沙箱默认关闭：本机 docker.sock 等同宿主机 root。
      # 系统管理员也可在「设置 → 系统设置」打开（立即生效）。未落库时读本变量。
      - WEKNORA_SANDBOX_DOCKER_ENABLED=${WEKNORA_SANDBOX_DOCKER_ENABLED:-false}
      # gin 信任的代理 CIDR（逗号分隔）；显式设为空字符串则禁用代理信任。
      # 默认信任 loopback + 私网段（容器网络内 nginx 已覆盖）
      # - WEKNORA_TRUSTED_PROXIES=${WEKNORA_TRUSTED_PROXIES:-}
      # 启动时自动执行数据库迁移；设为 false 禁用，默认启用
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      # IM 渠道图片/文件外链的外部可达 URL。IM 显示知识库图片需二选一：
      # 存储后端公网可达（如 MINIO_ENDPOINT 设为公网），或设本变量走 <APP_EXTERNAL_URL>/r/<token>（需 nginx 代理 /r/）。
      # 默认 MinIO 内网部署 / local 后端需设本变量。
      # - APP_EXTERNAL_URL=${APP_EXTERNAL_URL:-}
      # 前端外部 origin，用于邀请链接等绝对 URL（留空走 host-relative）
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
      # ========== 对象存储 - 腾讯云 COS ==========
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_REGION=${COS_REGION:-}
      - COS_BUCKET_NAME=${COS_BUCKET_NAME:-}
      - COS_APP_ID=${COS_APP_ID:-}
      - COS_PATH_PREFIX=${COS_PATH_PREFIX:-}
      - COS_TEMP_BUCKET_NAME=${COS_TEMP_BUCKET_NAME:-}
      - COS_TEMP_REGION=${COS_TEMP_REGION:-}

      # 认证 / 空间 / RBAC / 审计
      # 禁止新用户注册（生产建议 true）
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}
      # 开启后密码必须包含大小写字母、数字和特殊字符，特殊字符包含：!@#$%^&*()_+-=[]{}|;:,.<>?
      - WEKNORA_AUTH_COMPLEX_PASSWORD_ENABLED=${WEKNORA_AUTH_COMPLEX_PASSWORD_ENABLED:-false}
      # 公开注册后的默认空间策略：create_personal（默认，自动创建个人空间）/ tenantless
      - WEKNORA_AUTH_DEFAULT_TENANT_MODE=${WEKNORA_AUTH_DEFAULT_TENANT_MODE:-create_personal}
      # 是否允许普通用户登录后主动创建空间（默认 true；false 仅能邀请加入，超管不受影响）
      - WEKNORA_TENANT_SELF_SERVICE_CREATION_ENABLED=${WEKNORA_TENANT_SELF_SERVICE_CREATION_ENABLED:-true}
      # 启用跨空间访问（需配合用户的 CanAccessAllTenants 权限；默认 false
      - WEKNORA_TENANT_ENABLE_CROSS_TENANT_ACCESS=${WEKNORA_TENANT_ENABLE_CROSS_TENANT_ACCESS:-false}
      # 新建空间默认存储配额（GB，默认 10）
      - WEKNORA_TENANT_DEFAULT_STORAGE_QUOTA_GB=${WEKNORA_TENANT_DEFAULT_STORAGE_QUOTA_GB:-10}
      # 空间邀请链接 TTL（Go duration，默认 168h=7 天）
      - WEKNORA_INVITATION_TTL=${WEKNORA_INVITATION_TTL:-168h}
      # 审计日志保留天数（0 禁用清理，默认 90）
      - WEKNORA_AUDIT_RETENTION_DAYS=${WEKNORA_AUDIT_RETENTION_DAYS:-90}
      # 数据库设置
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-}
      # SQLite 驱动时使用（DB_DRIVER=sqlite）；postgres 驱动忽略
      # - DB_PATH=${DB_PATH:-}
      # ========== Langfuse (optional observability) ==========
      # Enabled automatically when LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY are set.
      # See docs/Langfuse集成.md for the full list of tuning knobs.
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_RELEASE=${LANGFUSE_RELEASE:-}
      - LANGFUSE_ENVIRONMENT=${LANGFUSE_ENVIRONMENT:-}
      - LANGFUSE_FLUSH_AT=${LANGFUSE_FLUSH_AT:-}
      - LANGFUSE_FLUSH_INTERVAL=${LANGFUSE_FLUSH_INTERVAL:-}
      - LANGFUSE_QUEUE_SIZE=${LANGFUSE_QUEUE_SIZE:-}
      - LANGFUSE_REQUEST_TIMEOUT=${LANGFUSE_REQUEST_TIMEOUT:-}
      - LANGFUSE_SAMPLE_RATE=${LANGFUSE_SAMPLE_RATE:-}
      - LANGFUSE_DEBUG=${LANGFUSE_DEBUG:-}
      # 向量库 / 检索引擎
      - RETRIEVE_DRIVER=${RETRIEVE_DRIVER:-postgres}
      - ELASTICSEARCH_ADDR=${ELASTICSEARCH_ADDR:-}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_INDEX=${ELASTICSEARCH_INDEX:-}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6334}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-weknora_embeddings}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_USE_TLS=${QDRANT_USE_TLS:-false}
      - MILVUS_ADDRESS=${MILVUS_ADDRESS:-milvus:19530}
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-weknora_embeddings}
      - MILVUS_METRIC_TYPE=${MILVUS_METRIC_TYPE:-IP}
      - MILVUS_USERNAME=${MILVUS_USERNAME:-}
      - MILVUS_PASSWORD=${MILVUS_PASSWORD:-}
      - MILVUS_DB_NAME=${MILVUS_DB_NAME:-}
      # 多向量库并行检索超时（秒，RETRIEVE_DRIVER 含多个驱动时生效）
      - MULTI_STORE_RETRIEVE_TIMEOUT_SEC=${MULTI_STORE_RETRIEVE_TIMEOUT_SEC:-}
      # ========== OpenSearch（RETRIEVE_DRIVER=opensearch）==========
      - OPENSEARCH_ADDR=${OPENSEARCH_ADDR:-}
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:-}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-}
      - OPENSEARCH_INSECURE_SKIP_VERIFY=${OPENSEARCH_INSECURE_SKIP_VERIFY:-false}
      - OPENSEARCH_INDEX=${OPENSEARCH_INDEX:-}
      # ========== 腾讯云 VectorDB（RETRIEVE_DRIVER=tencent_vectordb）==========
      - TENCENT_VECTORDB_ADDR=${TENCENT_VECTORDB_ADDR:-}
      - TENCENT_VECTORDB_USERNAME=${TENCENT_VECTORDB_USERNAME:-}
      - TENCENT_VECTORDB_API_KEY=${TENCENT_VECTORDB_API_KEY:-}
      - TENCENT_VECTORDB_DATABASE=${TENCENT_VECTORDB_DATABASE:-}
      - TENCENT_VECTORDB_COLLECTION=${TENCENT_VECTORDB_COLLECTION:-}
      - TENCENT_VECTORDB_REPLICA_NUMBER=${TENCENT_VECTORDB_REPLICA_NUMBER:-}
      # Docreader 解析调优
      - DOCREADER_ADDR=${DOCREADER_ADDR:-docreader:50051}
      - DOCREADER_TRANSPORT=${DOCREADER_TRANSPORT:-grpc}
      # docreader gRPC TLS / 认证（客户端侧）
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT=${GRPC_TLS_CERT:-}
      - GRPC_TLS_KEY=${GRPC_TLS_KEY:-}
      - GRPC_TLS_CA=${GRPC_TLS_CA:-}
      - GRPC_TLS_SERVER_NAME=${GRPC_TLS_SERVER_NAME:-}
      - GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:-}
      - WEAVIATE_HOST=${WEAVIATE_HOST:-}
      - WEAVIATE_GRPC_ADDRESS=${WEAVIATE_GRPC_ADDRESS:-}
      - WEAVIATE_SCHEME=${WEAVIATE_SCHEME:-}
      - WEAVIATE_AUTH_ENABLED=${WEAVIATE_AUTH_ENABLED:-}
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY:-}
      - DORIS_ADDR=${DORIS_ADDR:-}
      - DORIS_HTTP_PORT=${DORIS_HTTP_PORT:-}
      - DORIS_DATABASE=${DORIS_DATABASE:-}
      - DORIS_USERNAME=${DORIS_USERNAME:-}
      - DORIS_PASSWORD=${DORIS_PASSWORD:-}
      - DORIS_TABLE_PREFIX=${DORIS_TABLE_PREFIX:-}
      - DORIS_COMPAT_MODE=${DORIS_COMPAT_MODE:-}
      # ========== 文件存储 ==========
      - STORAGE_TYPE=${STORAGE_TYPE:-minio}
      # 允许用户使用的存储类型白名单（逗号分隔，留空允许全部）
      - STORAGE_ALLOW_LIST=${STORAGE_ALLOW_LIST:-}
      - LOCAL_STORAGE_BASE_DIR=${LOCAL_STORAGE_BASE_DIR:-/data/files}
      # 本地存储路径前缀（legacy 回填用，一般留空）
      - LOCAL_STORAGE_PATH_PREFIX=${LOCAL_STORAGE_PATH_PREFIX:-}
      - AUTO_RECOVER_DIRTY=${AUTO_RECOVER_DIRTY:-true}
      # ----- MinIO（STORAGE_TYPE=minio）-----
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-minioadmin}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-weknoraMinioSecret123}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-weknora}
      - MINIO_PATH_PREFIX=${MINIO_PATH_PREFIX:-}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      # ----- 火山引擎 TOS（STORAGE_TYPE=tos）-----
      - TOS_ENDPOINT=${TOS_ENDPOINT:-}
      - TOS_REGION=${TOS_REGION:-}
      - TOS_ACCESS_KEY=${TOS_ACCESS_KEY:-}
      - TOS_SECRET_KEY=${TOS_SECRET_KEY:-}
      - TOS_BUCKET_NAME=${TOS_BUCKET_NAME:-}
      - TOS_PATH_PREFIX=${TOS_PATH_PREFIX:-}
      - TOS_TEMP_BUCKET_NAME=${TOS_TEMP_BUCKET_NAME:-}
      - TOS_TEMP_REGION=${TOS_TEMP_REGION:-}
      # ----- AWS S3（STORAGE_TYPE=s3）-----
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PATH_PREFIX=${S3_PATH_PREFIX:-weknora/}
      - S3_USE_SSL=${S3_USE_SSL:-true}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      # ----- 华为云 OBS（STORAGE_TYPE=obs）-----
      - OBS_ENDPOINT=${OBS_ENDPOINT:-}
      - OBS_REGION=${OBS_REGION:-}
      - OBS_ACCESS_KEY=${OBS_ACCESS_KEY:-}
      - OBS_SECRET_KEY=${OBS_SECRET_KEY:-}
      - OBS_BUCKET_NAME=${OBS_BUCKET_NAME:-}
      - OBS_PATH_PREFIX=${OBS_PATH_PREFIX:-weknora/}
      - OBS_USE_SSL=${OBS_USE_SSL:-true}
      - OBS_PROXY_DOMAIN=${OBS_PROXY_DOMAIN:-}
      # ----- 阿里云 OSS（STORAGE_TYPE=oss）-----
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_REGION=${OSS_REGION:-}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-}
      - OSS_PATH_PREFIX=${OSS_PATH_PREFIX:-weknora/}
      - OSS_TEMP_BUCKET_NAME=${OSS_TEMP_BUCKET_NAME:-}
      - OSS_TEMP_REGION=${OSS_TEMP_REGION:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Ollama 不可用时仅告警不阻断（true 时生效）
      - OLLAMA_OPTIONAL=${OLLAMA_OPTIONAL:-true}
      # 批量 embedding 大小
      - BATCH_EMBED_SIZE=${BATCH_EMBED_SIZE:-}
      # VLM 单次 HTTP 请求超时（秒，默认 180）
      - VLM_HTTP_TIMEOUT_SECONDS=${VLM_HTTP_TIMEOUT_SECONDS:-}
      # LLM 流原始转储（排查上下文问题；1 启用，默认目录 ~/.weknora/investigate/llm-stream）
      - WEKNORA_LLM_STREAM_RAW_DUMP=${WEKNORA_LLM_STREAM_RAW_DUMP:-}
      - WEKNORA_LLM_STREAM_RAW_DUMP_DIR=${WEKNORA_LLM_STREAM_RAW_DUMP_DIR:-}
      - STREAM_MANAGER_TYPE=${STREAM_MANAGER_TYPE:-}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-}
      - REDIS_PREFIX=${REDIS_PREFIX:-}
      # Redis TLS（托管 Redis 加密传输；REDIS_USE_TLS=true 时生效，详见 .env.example）
      - REDIS_TLS_SERVER_NAME=${REDIS_TLS_SERVER_NAME:-}
      - REDIS_TLS_INSECURE_SKIP_VERIFY=${REDIS_TLS_INSECURE_SKIP_VERIFY:-}
      # Redis 频道命名空间后缀（多部署共享同一 Redis 时隔离用）
      - WEKNORA_REDIS_NAMESPACE=${WEKNORA_REDIS_NAMESPACE:-}
      # Asynq 客户端 Redis 读写超时（毫秒，默认 500）
      - WEKNORA_REDIS_OP_TIMEOUT_MS=${WEKNORA_REDIS_OP_TIMEOUT_MS:-}
      # 知识图谱唯一开关是 NEO4J_ENABLE（见下方）。ENABLE_GRAPH_RAG 自 v0.1.6 起已被
      # NEO4J_ENABLE 取代，Go 主应用不再读取，此处不再透传。
      - NEO4J_ENABLE=${NEO4J_ENABLE:-}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      # 数据库中 API Key 等敏感字段落盘加密的 AES-256 主密钥（必须为 32 字节）。
      # 加密范围：tenants.api_key、模型 API key、向量库凭证、web search provider key、
      # WeKnoraCloud.AppSecret 等。缺失或长度不对时，已加密字段无法解密（UI 显示为空，
      # 需重新填写）。生产环境必须显式设置且妥善保管，丢失则所有加密数据不可恢复。
      # （TENANT_AES_KEY / CRYPTO_MASTER_KEY / CRYPTO_SALT 已废弃：v0.4.0 起加密统一
      #   改用 SYSTEM_AES_KEY，Go 主应用不再读取这三个变量。）
      - SYSTEM_AES_KEY=${SYSTEM_AES_KEY:-}
      - SYSTEM_SIGNING_KEY=${SYSTEM_SIGNING_KEY:-}
      - SSRF_WHITELIST=${SSRF_WHITELIST:-}
      # 保留原始 URL 的图片域名白名单（逗号分隔，不替换为 provider://）
      - IMAGE_HOST_KEEP_URL=${IMAGE_HOST_KEEP_URL:-}
      # Always allow the optional searxng sidecar, bundled vector stores, and
      # the default MinIO storage host (compose service names). User-controlled
      # endpoints are SSRF-validated and these private docker-network hosts
      # would otherwise be rejected; whitelisting them keeps the
      # out-of-box experience. Merged on top of SSRF_WHITELIST so user
      # overrides don't clobber it. (postgres is intentionally NOT listed: it
      # is not a user-registerable vector store, and whitelisting the app's own
      # DB host would skip the 5432 port block.)
      # doris-be: Stream Load follows FE→BE redirects that must receive Basic
      # credentials on whitelisted BE hosts.
      - SSRF_WHITELIST_EXTRA=${SSRF_WHITELIST_EXTRA:-searxng,qdrant,milvus,weaviate,doris-fe,doris-be,minio}
      - CONCURRENCY_POOL_SIZE=${CONCURRENCY_POOL_SIZE:-5}
      - JWT_SECRET=${JWT_SECRET:-}
      # File size limit (in MB)
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      # Skill zip / GitHub source download cap (in MB); the GitHub zipball is the whole repo, not the skill subtree
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      # 文档处理任务总超时（Go duration，默认 2h）
      - WEKNORA_DOCUMENT_PROCESS_TIMEOUT=${WEKNORA_DOCUMENT_PROCESS_TIMEOUT:-}
      # 单次 DocReader RPC 超时（默认 30m，须小于上一项）
      - WEKNORA_DOCREADER_CALL_TIMEOUT=${WEKNORA_DOCREADER_CALL_TIMEOUT:-}
      # 知识库巡检回收（回收卡在 processing 的脏数据；false 禁用，不建议）
      - WEKNORA_HOUSEKEEPING_ENABLED=${WEKNORA_HOUSEKEEPING_ENABLED:-}
      - WEKNORA_CHAT_ATTACHMENT_TTL_HOURS=${WEKNORA_CHAT_ATTACHMENT_TTL_HOURS:-24}
      - WEKNORA_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC=${WEKNORA_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC:-60}
      - WEKNORA_CHAT_ATTACHMENT_OCR_CONCURRENCY=${WEKNORA_CHAT_ATTACHMENT_OCR_CONCURRENCY:-8}
      - WEKNORA_CHAT_ATTACHMENT_OCR_MAX_PAGES=${WEKNORA_CHAT_ATTACHMENT_OCR_MAX_PAGES:-8}
      # Agent LLM call timeout
      - WEKNORA_AGENT_LLM_TIMEOUT=${WEKNORA_AGENT_LLM_TIMEOUT:-}
      - WEKNORA_AGENT_TOOL_APPROVAL_TIMEOUT=${WEKNORA_AGENT_TOOL_APPROVAL_TIMEOUT:-}
      # MCP 工具人工审批失败时是否放行（true 放行 / 默认 fail-close 拒绝）
      - WEKNORA_AGENT_TOOL_APPROVAL_FAIL_OPEN=${WEKNORA_AGENT_TOOL_APPROVAL_FAIL_OPEN:-}
      # Tenant / RBAC（详见 docs/RBAC说明.md 与 .env.example 注释）
      # - WEKNORA_TENANT_ENABLE_RBAC: 是否启用空间角色强制鉴权（true / false），默认 true
      # - WEKNORA_TENANT_MAX_OWNED_PER_USER: 单个非超管自助创建空间的上限
      #   >0 强制限额；=0 走 handler 默认；<0 关闭限额（不建议共享部署使用）
      # - WEKNORA_TENANT_AUTO_CREATE_API_KEY: 创建空间时自动生成 full_access API Key 并在响应中返回 token
      #   （兼容旧版默认下发 API Key 行为，破坏性变更回退开关；true / false，默认 false）
      - WEKNORA_TENANT_ENABLE_RBAC=${WEKNORA_TENANT_ENABLE_RBAC:-}
      - WEKNORA_TENANT_MAX_OWNED_PER_USER=${WEKNORA_TENANT_MAX_OWNED_PER_USER:-}
      - WEKNORA_TENANT_AUTO_CREATE_API_KEY=${WEKNORA_TENANT_AUTO_CREATE_API_KEY:-}
      - WEKNORA_ASYNQ_CORE_CONCURRENCY=${WEKNORA_ASYNQ_CORE_CONCURRENCY:-8}
      - WEKNORA_ASYNQ_POSTPROCESS_CONCURRENCY=${WEKNORA_ASYNQ_POSTPROCESS_CONCURRENCY:-2}
      - WEKNORA_ASYNQ_ENRICHMENT_CONCURRENCY=${WEKNORA_ASYNQ_ENRICHMENT_CONCURRENCY:-12}
      - WEKNORA_ASYNQ_MAINTENANCE_CONCURRENCY=${WEKNORA_ASYNQ_MAINTENANCE_CONCURRENCY:-4}
      - WEKNORA_ASYNQ_SHARED_CONCURRENCY=${WEKNORA_ASYNQ_SHARED_CONCURRENCY:-6}
      - WEKNORA_WIKI_ASYNQ_CONCURRENCY=${WEKNORA_WIKI_ASYNQ_CONCURRENCY:-8}
      - WEKNORA_MODEL_MAX_CONCURRENCY=${WEKNORA_MODEL_MAX_CONCURRENCY:-32}
      - APK_MIRROR_ARG=${APK_MIRROR_ARG:-}
      - WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL=${WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL:-}
      # ========== OIDC 认证（可选，OIDC_AUTH_ENABLE=true 启用，详见 .env.example）==========
      - OIDC_AUTH_ENABLE=${OIDC_AUTH_ENABLE:-false}
      - OIDC_AUTH_ISSUER_URL=${OIDC_AUTH_ISSUER_URL:-}
      - OIDC_AUTH_DISCOVERY_URL=${OIDC_AUTH_DISCOVERY_URL:-}
      - OIDC_AUTH_PROVIDER_DISPLAY_NAME=${OIDC_AUTH_PROVIDER_DISPLAY_NAME:-}
      - OIDC_AUTH_CLIENT_ID=${OIDC_AUTH_CLIENT_ID:-}
      - OIDC_AUTH_CLIENT_SECRET=${OIDC_AUTH_CLIENT_SECRET:-}
      - OIDC_AUTH_AUTHORIZATION_ENDPOINT=${OIDC_AUTH_AUTHORIZATION_ENDPOINT:-}
      - OIDC_AUTH_TOKEN_ENDPOINT=${OIDC_AUTH_TOKEN_ENDPOINT:-}
      - OIDC_AUTH_USER_INFO_ENDPOINT=${OIDC_AUTH_USER_INFO_ENDPOINT:-}
      - OIDC_AUTH_JWKS_URI=${OIDC_AUTH_JWKS_URI:-}
      - OIDC_AUTH_SCOPES=${OIDC_AUTH_SCOPES:-}
      - OIDC_USER_INFO_MAPPING_USER_NAME=${OIDC_USER_INFO_MAPPING_USER_NAME:-}
      - OIDC_USER_INFO_MAPPING_EMAIL=${OIDC_USER_INFO_MAPPING_EMAIL:-}
      # 飞书云文档解析模式 export：导出为docx，blocks：根据飞书云文档块解析为markdown。默认为:export
      - FEISHU_DOCX_PARSE_MODE=${FEISHU_DOCX_PARSE_MODE:-export}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      docreader:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - 1panel-network
    restart: always
    labels:
      createdBy: "Apps"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  docreader:
    image: wechatopenai/weknora-docreader:latest
    container_name: ${CONTAINER_NAME}-docreader
    expose:
      - "50051"
    volumes:
      - ./data/docreader-tmp:/tmp/docreader
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - DOCREADER_IMAGE_OUTPUT_DIR=/tmp/docreader
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-}
      - SSRF_WHITELIST=${SSRF_WHITELIST:-}
      - SSRF_WHITELIST_EXTRA=${SSRF_WHITELIST_EXTRA:-}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT=${GRPC_TLS_CERT:-}
      - GRPC_TLS_KEY=${GRPC_TLS_KEY:-}
      - GRPC_TLS_CA=${GRPC_TLS_CA:-}
      - GRPC_TLS_SERVER_NAME=${GRPC_TLS_SERVER_NAME:-}
      - GRPC_MTLS_REQUIRE_CLIENT_CERT=${GRPC_MTLS_REQUIRE_CLIENT_CERT:-false}
      - GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:-}
      - DOCREADER_GRPC_MAX_WORKERS=${DOCREADER_GRPC_MAX_WORKERS:-4}
      - DOCREADER_GRPC_MAX_FILE_SIZE_MB=${DOCREADER_GRPC_MAX_FILE_SIZE_MB:-${MAX_FILE_SIZE_MB:-50}}
      - DOCREADER_GRPC_PORT=${DOCREADER_GRPC_PORT:-50051}
      - DOCREADER_DOCX_MAX_PAGES=${DOCREADER_DOCX_MAX_PAGES:-0}
      - DOCREADER_MARKITDOWN_MAX_WORKERS=${DOCREADER_MARKITDOWN_MAX_WORKERS:-1}
      - DOCREADER_EXTERNAL_HTTP_PROXY=${DOCREADER_EXTERNAL_HTTP_PROXY:-}
      - DOCREADER_EXTERNAL_HTTPS_PROXY=${DOCREADER_EXTERNAL_HTTPS_PROXY:-}
      - DOCREADER_ODL_MAX_WORKERS=${DOCREADER_ODL_MAX_WORKERS:-1}
      - DOCREADER_ODL_HYBRID=${DOCREADER_ODL_HYBRID:-off}
      - DOCREADER_ODL_HYBRID_URL=${DOCREADER_ODL_HYBRID_URL:-http://odl-hybrid:5002}
      - DOCREADER_ODL_HYBRID_MODE=${DOCREADER_ODL_HYBRID_MODE:-auto}
      - DOCREADER_ODL_HYBRID_FALLBACK=${DOCREADER_ODL_HYBRID_FALLBACK:-false}
      - DOCREADER_ODL_MARKDOWN_WITH_HTML=${DOCREADER_ODL_MARKDOWN_WITH_HTML:-false}
      - DOCREADER_PDF_RENDER_MAX_WORKERS=${DOCREADER_PDF_RENDER_MAX_WORKERS:-1}
      - DOCREADER_PDF_RENDER_PARALLELISM=${DOCREADER_PDF_RENDER_PARALLELISM:-}
      - DOCREADER_PDF_RENDER_DPI=${DOCREADER_PDF_RENDER_DPI:-200}
      - DOCREADER_PDF_JPEG_QUALITY=${DOCREADER_PDF_JPEG_QUALITY:-85}
      - DOCREADER_PDF_RENDER_MAX_EDGE=${DOCREADER_PDF_RENDER_MAX_EDGE:-2000}
      - DOCREADER_PDF_FORCE_SCANNED=${DOCREADER_PDF_FORCE_SCANNED:-false}
      - DOCREADER_PDF_WORD_GAP_WIDTH_RATIO=${DOCREADER_PDF_WORD_GAP_WIDTH_RATIO:-0.4}
      - DOCREADER_PDF_MARGIN_COL_WIDTH_RATIO=${DOCREADER_PDF_MARGIN_COL_WIDTH_RATIO:-0.12}
      - DOCREADER_PDF_MIN_HEADING_LINE_CHARS=${DOCREADER_PDF_MIN_HEADING_LINE_CHARS:-8}
      - DOCREADER_PDF_SANITIZE_TEXT=${DOCREADER_PDF_SANITIZE_TEXT:-true}
      - DOCREADER_PDF_STRIP_CHART_DEBRIS=${DOCREADER_PDF_STRIP_CHART_DEBRIS:-true}
      - DOCREADER_PDF_RENDER_VECTOR_FIGURES=${DOCREADER_PDF_RENDER_VECTOR_FIGURES:-true}
      - DOCREADER_PDF_DETECT_HEADINGS=${DOCREADER_PDF_DETECT_HEADINGS:-}
      - DOCREADER_PDF_LAYOUT_ORDERING=${DOCREADER_PDF_LAYOUT_ORDERING:-}
      - DOCREADER_PDF_FILTER_HIDDEN_TEXT=${DOCREADER_PDF_FILTER_HIDDEN_TEXT:-}
      - DOCREADER_PDF_SCAN_IMAGE_RATIO=${DOCREADER_PDF_SCAN_IMAGE_RATIO:-}
      - DOCREADER_PDF_SCAN_MIN_CHARS=${DOCREADER_PDF_SCAN_MIN_CHARS:-}
      - DOCREADER_PDF_EXTRACT_EMBEDDED_IMAGES=${DOCREADER_PDF_EXTRACT_EMBEDDED_IMAGES:-}
      - DOCREADER_PDF_EMBED_MIN_PIXELS=${DOCREADER_PDF_EMBED_MIN_PIXELS:-}
      - DOCREADER_PDF_EMBED_MIN_AREA_RATIO=${DOCREADER_PDF_EMBED_MIN_AREA_RATIO:-}
      - DOCREADER_PDF_EMBED_REPEAT_PAGE_FRAC=${DOCREADER_PDF_EMBED_REPEAT_PAGE_FRAC:-}
      - DOCREADER_PDF_EMBED_MAX_IMAGES=${DOCREADER_PDF_EMBED_MAX_IMAGES:-}
      - DOCREADER_PDF_MIN_CHART_REGION_AREA=${DOCREADER_PDF_MIN_CHART_REGION_AREA:-}
      - DOCREADER_PDF_MIN_CHART_REGION_CHARS=${DOCREADER_PDF_MIN_CHART_REGION_CHARS:-}
      - DOCREADER_PDF_MAX_CHART_REGION_AREA=${DOCREADER_PDF_MAX_CHART_REGION_AREA:-}
      - DOCREADER_PDF_MAX_FIGURE_HEIGHT_RATIO=${DOCREADER_PDF_MAX_FIGURE_HEIGHT_RATIO:-}
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - 1panel-network
    restart: always
    labels:
      createdBy: "Apps"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: paradedb/paradedb:v0.22.6-pg17
    container_name: ${CONTAINER_NAME}-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-weknoraDBpass123}
      - POSTGRES_DB=${DB_NAME:-WeKnora}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-WeKnora}"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    labels:
      createdBy: "Apps"
    stop_grace_period: 1m

  redis:
    image: redis:7.0-alpine
    container_name: ${CONTAINER_NAME}-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-weknoraRedispass123}
    volumes:
      - ./data/redis:/data
    networks:
      - 1panel-network
    restart: always
    labels:
      createdBy: "Apps"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ${CONTAINER_NAME}-minio
    ports:
      - "${PANEL_APP_PORT_S3}:9000"
      - "${PANEL_APP_PORT_ADMIN}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY:-weknoraMinioSecret123}
    command: server --console-address ":9001" /data
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - 1panel-network
    restart: always
    labels:
      createdBy: "Apps"

  searxng:
    image: searxng/searxng:latest
    container_name: ${CONTAINER_NAME}-searxng
    ports:
      - "${PANEL_APP_PORT_SEARXNG}:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:${PANEL_APP_PORT_SEARXNG}/
      - INSTANCE_NAME=weknora-searxng
      - SEARXNG_SECRET=${SEARXNG_SECRET:-weknoraSearxngSecret0123456789}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - 1panel-network
    restart: always
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
