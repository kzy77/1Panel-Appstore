services:
  jdxb:
    image: ionewu/owjdxb
    container_name: ${CONTAINER_NAME}
    network_mode: host
    volumes:
      - ./store:/data/store
    devices:
      - "/dev/net/tun:/dev/net/tun"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    restart: always
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
