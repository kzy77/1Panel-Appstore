services:
  openmaic:
    build:
      context: https://github.com/THU-MAIC/OpenMAIC.git#main
      dockerfile: Dockerfile
    image: openmaic:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - "${PANEL_APP_PORT_HTTP}:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - ./data/.env.local
    environment:
      - TZ=Asia/Shanghai
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
