title: OpenMAIC - 一键生成沉浸式多智能体课堂
description: OpenMAIC 是一个开源的多智能体学习平台，由多智能体编排驱动，可一键生成课件、测验、交互式模拟与项目式学习活动，由可开口讲题、可在白板书写并实时互动的 AI 老师与 AI 同学共同呈现。
