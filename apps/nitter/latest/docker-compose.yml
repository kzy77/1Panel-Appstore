services:
  nitter:
    image: zedeus/nitter:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    volumes:
      - ./data/nitter.conf:/src/nitter.conf
      - ./data/sessions.jsonl:/src/sessions.jsonl
    depends_on:
      - nitter-redis
    labels:
      createdBy: "Apps"

  nitter-redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_NAME}-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ./data/redis:/data
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
