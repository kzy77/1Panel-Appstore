    zh: DeepTutor 是一个开源的终身个性化 AI 辅导平台，集成 RAG 知识库、多模型支持、智能体、测验与长期记忆系统。用户可基于私有资料构建个性化学习路径，进行问答、生成测验、管理知识库，打造可持续的个性化辅导体验。
    en: DeepTutor is an open-source lifelong personalized AI tutoring platform integrating RAG knowledge bases, multi-model support, agents, quizzes, and long-term memory. Build personalized learning paths from your own materials, run Q&A, generate quizzes, and manage knowledge bases for a continuous tutoring experience.
