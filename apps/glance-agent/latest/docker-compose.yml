services:
  glance-agent:
    container_name: ${CONTAINER_NAME}
    image: glanceapp/agent:latest
    environment:
      TOKEN: ${AGENT_TOKEN}
    volumes:
      - /storage:/storage:ro
    ports:
      - ${PANEL_APP_PORT_HTTP}:27973
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
    restart: always
networks:
  1panel-network:
    external: true
