services:
  xiaomusic:
    image: hanxi/xiaomusic:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - ${PANEL_APP_PORT_HTTP}:8090
    environment:
      XIAOMUSIC_PUBLIC_PORT: ${PANEL_APP_PORT_HTTP}
      TZ: ${TZ}
    volumes:
      - ${APP_DATA}/music:/app/music
      - ${APP_DATA}/conf:/app/conf
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
