    zh: Bark 是一款注重隐私、免费开源的 iOS 推送通知服务。安装 Bark App 并注册设备后，可通过简单的 HTTP 接口向自己的 iPhone 推送自定义通知，支持标题/正文/Markdown、分组、自定义铃声、角标、加密推送与历史记录等能力，并自带 Web 控制台。
    en: Bark is a privacy-focused, free and open-source iOS push notification service. After installing the Bark app and registering a device, you can send custom notifications to your iPhone via simple HTTP endpoints, with support for title/body/Markdown, grouping, custom sounds, badges, encrypted pushes, history and a built-in Web console.
